<svg xmlns="http://www.w3.org/2000/svg" width="960" height="264" viewBox="0 0 960 264" role="img" aria-label="The Construct workstation">
  <rect width="960" height="264" rx="20" fill="#121516"/><g transform="translate(8.0,0)">
    <rect width="304" height="124" rx="16" fill="#1A1F21" stroke="#2A3336"/>
    <rect x="20" y="18" width="8" height="8" rx="4" fill="#01b4c8"/>
    <text x="36" y="26" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="-0.01em" fill="#E8EEF0">Desktop</text>
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">A cloud work OS: Chat, Files, Browser,</text><text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">Terminal, Email, Calendar, Workflows,</text><text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">Memories, Activity.</text>
  </g><g transform="translate(328.0,0)">
    <rect width="304" height="124" rx="16" fill="#1A1F21" stroke="#2A3336"/>
    <rect x="20" y="18" width="8" height="8" rx="4" fill="#01b4c8"/>
    <text x="36" y="26" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="-0.01em" fill="#E8EEF0">Files</text>
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">A searchable workspace that survives</text><text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">the thread. Upload, generate, keep the</text><text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">artifact.</text>
  </g><g transform="translate(648.0,0)">
    <rect width="304" height="124" rx="16" fill="#1A1F21" stroke="#2A3336"/>
    <rect x="20" y="18" width="8" height="8" rx="4" fill="#01b4c8"/>
    <text x="36" y="26" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="-0.01em" fill="#E8EEF0">Memory</text>
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">Inspect, correct, forget, or restore.</text><text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">Preferences do not live only in a</text><text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">chat.</text>
  </g><g transform="translate(8.0,140)">
    <rect width="304" height="124" rx="16" fill="#1A1F21" stroke="#2A3336"/>
    <rect x="20" y="18" width="8" height="8" rx="4" fill="#01b4c8"/>
    <text x="36" y="26" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="-0.01em" fill="#E8EEF0">Browser and terminal</text>
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">Live browser runs for real sites.</text><text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">Isolated sandbox with a durable</text><text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">/workspace.</text>
  </g><g transform="translate(328.0,140)">
    <rect width="304" height="124" rx="16" fill="#1A1F21" stroke="#2A3336"/>
    <rect x="20" y="18" width="8" height="8" rx="4" fill="#01b4c8"/>
    <text x="36" y="26" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="-0.01em" fill="#E8EEF0">Email and calendar</text>
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">Native agent inbox on Starter and Pro.</text><text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">Jobs that run — not reminders that</text><text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">wait.</text>
  </g><g transform="translate(648.0,140)">
    <rect width="304" height="124" rx="16" fill="#1A1F21" stroke="#2A3336"/>
    <rect x="20" y="18" width="8" height="8" rx="4" fill="#01b4c8"/>
    <text x="36" y="26" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="-0.01em" fill="#E8EEF0">Apps and channels</text>
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">Gmail, Notion, Linear, GitHub,</text><text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">HubSpot. Web, Slack, Telegram,</text><text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8AA3AB">Discord, email.</text>
  </g>
</svg>
